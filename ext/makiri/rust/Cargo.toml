[package]
name = "makiri_rs"
version = "0.0.1"
edition = "2021"
publish = false
description = "The Makiri gem's extension: HTML5 parsing, XPath 1.0 and an XML reader"

[lib]
# The Ruby extension is `makiri.bundle` / `makiri.so`, loaded by
# `require "makiri/makiri"`, and rb_sys's generated Makefile copies
# `lib<lib name>.<soext>` into place - so the LIB name has to be `makiri` even
# though the package is `makiri_rs`. (The package keeps the `_rs` suffix: it is
# what `fuzz/Cargo.toml` depends on by name, and it distinguishes the crate from
# the gem in cargo output.)
name = "makiri"
# cdylib is what Ruby loads; rlib is what the cargo-fuzz crate under fuzz/
# depends on. The staticlib that used to be linked into the C extension is gone
# with it - nothing consumed it any more, and building it cost every build.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# `kani` is set by cargo-kani, not by cargo, so declare it or every build warns
# about an unexpected cfg name (and CI's `clippy -D warnings` turns that into an
# error). The proof modules are compiled only under it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
# Three features, and each names a real optional dependency rather than a step
# of the C port: a Ruby runtime, a vendored C library, and a test hook.
#
# The port's thirty-seven per-file flags are gone. They existed so one C file at
# a time could be replaced behind an identical ABI; there is no C left to
# replace, so a flag per former file only described history.
default = ["ruby"]

# The Ruby boundary: magnus, rb-sys, and everything under `bridge/`, `glue/`
# and `init.rs`. Off, the crate is the engine alone - which is what Kani and
# cargo-fuzz build, since neither can link a live Ruby.
ruby = ["lexbor", "dep:magnus", "dep:rb-sys"]

# The vendored Lexbor: build.rs runs bindgen over its headers, so this also
# decides whether a build needs `vendor/lexbor/dist` to exist at all. `rake
# kani` turns it OFF deliberately - the proofs are over the XML reader and the
# XPath front end, and not needing a Lexbor build is what lets them run without
# `rake compile` first.
lexbor = []

# Allocation-failure injection, the Rust half of `rake oom`. Off,
# `falloc::should_fail` is a const false and the branch disappears.
alloc-inject = []

[dependencies]
# Only the `ruby` feature needs these; the engine builds without them, which is
# what lets Kani and cargo-fuzz compile it. `rb-sys` is magnus's own binding
# layer, taken directly for the raw VALUEs the boundary passes around and
# deliberately WITHOUT `link-ruby`: the extension is dlopen'd into a Ruby that
# already provides the rb_* symbols.
magnus = { version = "0.8", features = ["rb-sys"], optional = true }
rb-sys = { version = "0.9", optional = true }

# A panic crossing into C is undefined behaviour, and the engine is written so
# that no input-dependent path panics; `abort` is the fail-closed backstop
# (the same outcome as the C `assert`). overflow-checks stays ON in release:
# a wrapped size is exactly the class of bug fail-closed exists to stop.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false

[profile.dev]
panic = "abort"

# Examples are Ruby-free benchmarks/probes over the vendored Lexbor. They use
# modules gated behind the `lexbor` feature, so cargo should skip building them
# when that feature is off (e.g. `cargo test --no-default-features`).
[[example]]
name = "probe"
required-features = ["lexbor"]

[[example]]
name = "idxbench"
required-features = ["lexbor"]

[[example]]
name = "idclass"
required-features = ["lexbor"]

[build-dependencies]
# Reads the vendored Lexbor headers so the layout is not transcribed by hand.
# libclang is already required by rb-sys, so this adds no new system dependency.
bindgen = "0.72"
