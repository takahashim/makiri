[package]
name = "makiri_rs"
version = "0.0.1"
edition = "2021"
# The oldest Rust a source install builds with - what the release's
# `source-gem-install` job installs and builds on, so the declaration is
# tested. It is today's floor (1.95 brought `if let` guards in a `match`),
# not a promise: raise it whenever a newer feature is worth having.
rust-version = "1.95"
publish = false
description = "The Makiri gem's extension: HTML5 parsing, XPath 1.0 and an XML reader"

[lib]
# The Ruby extension is `makiri.bundle` / `makiri.so`, loaded by
# `require "makiri/makiri"`, and rb_sys's generated Makefile copies
# `lib<lib name>.<soext>` into place - so the LIB name has to be `makiri` even
# though the package is `makiri_rs`. (The package keeps the `_rs` suffix: it is
# what `fuzz/Cargo.toml` depends on by name, and it distinguishes the crate from
# the gem in cargo output.)
name = "makiri"
# cdylib is what Ruby loads, and all it is: the cargo-fuzz crate depends on
# the engine and the Lexbor reference, not on this, and with an `rlib` beside
# it rustc would run no LTO.
crate-type = ["cdylib"]
path = "src/lib.rs"

# `kani` is set by cargo-kani, not by cargo, so declare it or every build warns
# about an unexpected cfg name (and CI's `clippy -D warnings` turns that into an
# error). The proof modules are compiled only under it.
[lints]
workspace = true

[workspace]
# The extension, the engine and the fallible allocation it allocates through,
# and the binding layer the extension is built on. `reference/` (the Lexbor
# reference, with its vendored C library and bindgen), `fuzz/` (cargo-fuzz's
# own nightly crate) and `lints/makiri_lints` (dylint's, on its own pinned
# nightly) are workspaces of their own, run from their directories - so this
# workspace's Cargo.lock, the one a source install builds from, holds nothing
# of Lexbor's, and no build script here reads a Lexbor header.
members = [".", "nupur", "engine", "falloc"]
exclude = ["fuzz", "lints", "reference"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)', 'cfg(makiri_lint_probe)', 'cfg(makiri_no_unwind)', 'cfg(nupur_lint_probe)', 'cfg(nupur_no_unwind)', 'cfg(dylint_lib, values(any()))'] }

# The panic gate. A panic now reaches Ruby as an exception (see the profile
# below), but it is still an INTERNAL error nobody asked for - `rescue => e`
# does not catch a `fatal` - so a new one has to be a decision rather than an
# accident: these two make it a build failure under CI's `-D warnings`, and the
# few sites that want one carry an `#[allow]` with a reason. Test code is
# exempt in `lib.rs`.
#
# `expect_used` joined them once method registration stopped `.expect`ing each
# definition (223 hits, now `?`): what remains is a handful of invariants, each
# with an `#[allow(..., reason = ...)]`. Not here are `indexing_slicing` and `arithmetic_side_effects` (469 hits, mostly the
# engine's own bounds-checked walks): gating those needs a different argument
# than "a panic aborts", since release builds keep `overflow-checks` on
# precisely so a wrapped size stops the process instead of answering wrong.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[features]
# The extension is the Ruby surface over the engine and nothing else: the
# engine's own features (`html-dom`, `lexbor-compat`) are the engine's, and
# the Lexbor references are `makiri_lexbor`'s.

# Allocation-failure injection, the Rust half of `rake oom`: the engine's
# allocations (`falloc`) and the binding layer's raising calls.
alloc-inject = ["makiri_engine/alloc-inject", "falloc/alloc-inject", "nupur/alloc-inject"]

[dependencies]
# The engine: the HTML parser and DOM, the XML reader, XPath and CSS - no
# Ruby, no Lexbor (`engine/`).
makiri_engine = { path = "engine", version = "0.0.1" }
falloc = { path = "falloc", version = "0.0.1" }
# `nupur` is the binding layer (`nupur/`): rb-sys, and every `unsafe` that
# talks to Ruby, behind safe types - the one layer between the glue and Ruby
# (magnus stood here until 2026-10). rb-sys comes with it; nothing here names
# it directly.
nupur = { path = "nupur", version = "0.0.1" }

# `unwind`, so a panic reaches Ruby as an exception instead of killing the host
# process. Every method's trampoline (`bridge::rb::method::finish`) catches a
# panic; `abort` was what stopped such a catch from ever running. With `unwind` a panic becomes a Ruby
# `fatal` - not caught by `rescue => e`, caught by `rescue Exception`, and it
# runs `ensure` blocks and `at_exit` on the way out. `abort` ran neither, and
# ran no destructor either, so this also RELEASES what the old setting leaked.
#
# A callback is the case this does not cover by itself: Rust turns an unwind at
# an `extern "C"` boundary into an abort, because unwinding through C frames
# built without unwind tables is undefined behaviour. So every callback catches
# its own panic and the caller re-raises it past the C frames - `caught::
# PanicLatch`, installed in all eight (the CSS traversal, the serializer sink,
# the tokenizer hook, the GVL trampoline, and `bridge::ruby::protect`, which
# covers every `rb_protect`). The GC callbacks in `bridge/typed.rs` keep
# aborting on purpose; see CLAUDE.md.
#
# Anything that must be released across a panic is therefore a `Drop`, not a
# statement after the work. `lexbor::selectors::Session` and
# `post_parse::DocOwner` are the two that had to be converted.
#
# overflow-checks stays ON in release: a wrapped size is exactly the class of
# bug fail-closed exists to stop, and now it stops as an exception.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
overflow-checks = true
debug = false

[profile.dev]
panic = "unwind"
