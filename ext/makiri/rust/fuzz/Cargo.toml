[package]
name = "makiri-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# No Ruby: the glue needs magnus -> rb-sys -> a live Ruby, which a fuzz binary
# has no business linking. The targets drive the engine's front door the glue
# drives - the XML reader, the HTML parse and its indexes, XPath over both
# engine instances, and the CSS matcher over both DOMs - and so need `lexbor`,
# which is what carries the HTML instance.
[dependencies.makiri_rs]
path = ".."
default-features = false
# `css-reference` adds the OLD CSS engine, the reference `html_css_diff`
# compares against, and `lexbor-reference` Lexbor's tree, the reference
# `html_diff` compares the ported tree builder against, and its DOM, which
# `html_xpath_diff` holds the arena's XPath instance to (and Lexbor's selector
# and stylesheet parsers beside the ports, for `selector_diff` and
# `stylesheet_diff`), and `xml-css-reference` the CSS-to-XPath lowering the
# `css` target holds the XML matcher to; none ships in any build of the
# extension.
features = ["lexbor", "css-reference", "lexbor-reference", "xml-css-reference"]

[[bin]]
name = "xml"
path = "fuzz_targets/xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xpath"
path = "fuzz_targets/xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_xpath"
path = "fuzz_targets/xml_xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_xpath"
path = "fuzz_targets/html_xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_css"
path = "fuzz_targets/html_css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_css_diff"
path = "fuzz_targets/html_css_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_diff"
path = "fuzz_targets/html_diff.rs"
test = false
doc = false
bench = false

[[bin]]
