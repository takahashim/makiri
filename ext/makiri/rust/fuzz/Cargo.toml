[package]
name = "makiri-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# No Ruby: the glue needs magnus -> rb-sys -> a live Ruby, which a fuzz binary
# has no business linking. The targets drive the engine's front door the glue
# drives - the XML reader, the HTML parse and its indexes, XPath over both
# engine instances, and the CSS lowering - and so need `lexbor`, which is what
# carries the HTML instance and `css`.
[dependencies.makiri_rs]
path = ".."
default-features = false
features = ["lexbor"]

[[bin]]
name = "xml"
path = "fuzz_targets/xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xpath"
path = "fuzz_targets/xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_xpath"
path = "fuzz_targets/xml_xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_xpath"
path = "fuzz_targets/html_xpath.rs"
test = false
doc = false
bench = false
