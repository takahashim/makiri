[package]
name = "makiri-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# No Ruby: the glue needs magnus -> rb-sys -> a live Ruby, which a fuzz binary
# has no business linking. These targets drive the surfaces the retired C
# harnesses drove - the XML reader, the XPath front end, the XML engine
# instance.
#
# `lexbor` is on even though the targets pin the context's engine kind to XML:
# the dispatcher references BOTH monomorphizations, so the HTML instance has to
# exist. It used to be stubbed out with abort()s in a verify/stub.c; building
# the real one costs only compile time and removes a file whose whole job was to
# never be called. (This crate also used to compile four C files of its own -
# core/mkr_alloc.c, mkr_buf.c, mkr_utf8.c, xpath/mkr_xpath_err.c - because those
# symbols had no Rust provider outside the full extension build. They do now.)
[dependencies.makiri_rs]
path = ".."
default-features = false
features = ["lexbor"]

[[bin]]
name = "xml"
path = "fuzz_targets/xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xpath"
path = "fuzz_targets/xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_xpath"
path = "fuzz_targets/xml_xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false
