# `bridge::rb::Error` holds its formatted message inline (`crate::msg::Msg`,
# 256 bytes), so making one allocates nothing and touches no Ruby - an edit's
# closure may make one. That puts it past clippy's 128-byte default; a large
# `Err` costs a copy on the error path only.
large-error-threshold = 288

# The allocation chokepoint, enforced (see src/falloc/mod.rs).
#
# Rust's own allocating APIs are either infallible - they abort the process on
# OOM, which for a library inside someone's application server is not "failing
# closed" - or they are fallible but invisible to `rake oom`, which can only
# fail allocations that consult the injection counter. `falloc` fixes both, and
# this list is what keeps a new call site from quietly going around it.
#
# Scope: every way a container comes into existence, grows or shrinks its
# capacity. That includes the growth calls - `push`, `insert`, `extend`,
# `extend_from_slice`, `resize`, a map or set's `insert`, `collect` - which were
# once left out on the reasoning that after a reserve they cannot allocate. They
# cannot; but the reserve's count was the call site's to get right, review was
# all that checked it, and a miscount grew infallibly where the sweep could not
# fail it. `falloc::VecGrow` / `MapInsert` / `SetInsert` make the reserve and
# the write one call, so there is no count to get wrong. A plain call stays only
# under `#[allow(clippy::disallowed_methods, reason = ...)]`, where the room is
# known and a failure part-way could not be undone; tests and the reference-only
# modules allow it wholesale.
disallowed-methods = [
  { path = "std::boxed::Box::new", reason = "aborts on OOM; use falloc::try_box" },
  # `to_vec` is the same allocation as `Vec::from` under a friendlier name, and
  # it was one of the holes this list had. Its sibling `ToOwned::to_owned` is NOT
  # banned here, because it cannot be: on a `&str` it builds the String of a Ruby
  # exception message, which the glue is right to allocate infallibly on a path
  # that is already raising. The rule is per-LAYER and clippy.toml is crate-wide,
  # so the layer half is `rake dylint`'s `infallible_allocation`.
  { path = "slice::to_vec", reason = "aborts on OOM; use falloc::try_to_vec" },
  { path = "alloc::vec::Vec::with_capacity", reason = "aborts on OOM; use falloc::try_vec_with_capacity" },
  { path = "alloc::vec::Vec::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "alloc::vec::Vec::reserve_exact", reason = "aborts on OOM; use Reserve::falloc_reserve_exact" },
  { path = "alloc::vec::Vec::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "alloc::vec::Vec::try_reserve_exact", reason = "not injectable; use Reserve::falloc_reserve_exact" },
  # Shrinking is not a no-op: when capacity exceeds the target, `shrink_to_fit`
  # / `shrink_to` / `String::shrink_to_fit` REALLOCATE the buffer downwards and
  # abort on failure (verified with a failing global allocator), so they are
  # outside the sweep like any grow. They only reallocate when capacity > len;
  # the blessed shape is to reserve exactly and never need to shrink.
  { path = "alloc::vec::Vec::shrink_to_fit", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  { path = "alloc::vec::Vec::shrink_to", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  { path = "alloc::string::String::shrink_to_fit", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  # `into_boxed_slice` shrinks to `len` before converting, so it aborts the same
  # way. Its `From<Vec<T>>` / `.into()` conversion spellings reach the same code
  # and cannot be named here - the type-level half of this one lives in
  # `falloc::try_to_boxed_slice` and the ban keeps the method name out of a new
  # site.
  { path = "alloc::vec::Vec::into_boxed_slice", reason = "reallocs and aborts on OOM; use falloc::try_to_boxed_slice" },
  { path = "std::collections::HashMap::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashMap::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "std::collections::HashMap::with_capacity", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::with_capacity", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  # std's STABLE sorts take a scratch buffer from the global allocator and abort
  # the process when it cannot be had - outside falloc, so `rake oom` never
  # fails them. The unstable sorts sort in place and allocate nothing.
  { path = "slice::sort", reason = "allocates and aborts on OOM; use sort_unstable" },
  { path = "slice::sort_by", reason = "allocates and aborts on OOM; use sort_unstable_by" },
  { path = "slice::sort_by_key", reason = "allocates and aborts on OOM; use sort_unstable_by_key" },
  { path = "slice::sort_by_cached_key", reason = "allocates and aborts on OOM; sort in place" },
  # Growth. A `push` / `extend` / `insert` / `resize` grows its container
  # through the global allocator when it is full, and aborts on failure,
  # outside the sweep. The rule was "falloc_reserve exactly what follows, then
  # the plain call", held by review alone: a miscount grew infallibly, and
  # `rake oom` could not see it. Each now has a falloc spelling that reserves
  # and grows in one step (`VecGrow`, `MapInsert`), so a count is no longer a
  # thing to get right.
  { path = "alloc::vec::Vec::push", reason = "grows and aborts on OOM; use VecGrow::falloc_push" },
  { path = "alloc::vec::Vec::insert", reason = "grows and aborts on OOM; use VecGrow::falloc_insert" },
  { path = "alloc::vec::Vec::extend_from_slice", reason = "grows and aborts on OOM; use VecGrow::falloc_extend_from_slice" },
  { path = "alloc::vec::Vec::extend_from_within", reason = "grows and aborts on OOM; use VecGrow::falloc_extend_from_within" },
  { path = "alloc::vec::Vec::resize", reason = "grows and aborts on OOM; use VecGrow::falloc_resize" },
  { path = "alloc::vec::Vec::resize_with", reason = "grows and aborts on OOM; reserve with falloc_reserve, then fill" },
  { path = "alloc::vec::Vec::append", reason = "grows and aborts on OOM; reserve with falloc_reserve and move the elements" },
  { path = "core::iter::Extend::extend", reason = "grows and aborts on OOM; use VecGrow::falloc_extend" },
  { path = "alloc::string::String::push", reason = "grows and aborts on OOM" },
  { path = "alloc::string::String::push_str", reason = "grows and aborts on OOM" },
  { path = "alloc::collections::VecDeque::push_back", reason = "grows and aborts on OOM" },
  { path = "alloc::collections::VecDeque::push_front", reason = "grows and aborts on OOM" },
  { path = "std::collections::HashMap::insert", reason = "grows and aborts on OOM; use MapInsert::falloc_insert" },
  { path = "std::collections::HashSet::insert", reason = "grows and aborts on OOM; use MapInsert::falloc_insert" },
  { path = "std::collections::HashMap::entry", reason = "an insert through it grows and aborts on OOM; falloc_reserve(1) first, under an allow" },
  { path = "core::iter::Iterator::collect", reason = "a collection built by it grows and aborts on OOM; push with falloc" },
]
