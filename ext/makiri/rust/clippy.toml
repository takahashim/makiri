# The allocation chokepoint, enforced (see src/falloc.rs).
#
# Rust's own allocating APIs are either infallible - they abort the process on
# OOM, which for a library inside someone's application server is not "failing
# closed" - or they are fallible but invisible to `rake oom`, which can only
# fail allocations that consult the injection counter. `falloc` fixes both, and
# this list is what keeps a new call site from quietly going around it.
#
# Scope is deliberate. Banned here are the ways a NEW owning container comes
# into existence or grows its capacity, because those are unambiguous. `push`,
# `insert` and `extend` are NOT banned: after a successful reserve they cannot
# allocate, and that is the normal shape of the code. The residual risk - a
# `push` with no reserve in front of it - is left to review and recorded in
# notes/rust_port_remaining.ja.md rather than papered over with a lint that
# would need an allow on every second line.
disallowed-methods = [
  { path = "std::boxed::Box::new", reason = "aborts on OOM; use falloc::try_box / try_box_raw" },
  { path = "alloc::vec::Vec::with_capacity", reason = "aborts on OOM; use falloc::try_vec_with_capacity" },
  { path = "alloc::vec::Vec::reserve", reason = "aborts on OOM; use Reserve::mkr_reserve" },
  { path = "alloc::vec::Vec::reserve_exact", reason = "aborts on OOM; use Reserve::mkr_reserve_exact" },
  { path = "alloc::vec::Vec::try_reserve", reason = "not injectable; use Reserve::mkr_reserve" },
  { path = "alloc::vec::Vec::try_reserve_exact", reason = "not injectable; use Reserve::mkr_reserve_exact" },
  { path = "std::collections::HashMap::reserve", reason = "aborts on OOM; use Reserve::mkr_reserve" },
  { path = "std::collections::HashMap::try_reserve", reason = "not injectable; use Reserve::mkr_reserve" },
  { path = "std::collections::HashMap::with_capacity", reason = "aborts on OOM; use Reserve::mkr_reserve" },
  { path = "std::collections::HashSet::reserve", reason = "aborts on OOM; use Reserve::mkr_reserve" },
  { path = "std::collections::HashSet::try_reserve", reason = "not injectable; use Reserve::mkr_reserve" },
  { path = "std::collections::HashSet::with_capacity", reason = "aborts on OOM; use Reserve::mkr_reserve" },
]
