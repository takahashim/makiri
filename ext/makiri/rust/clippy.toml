# The allocation chokepoint, enforced (see src/falloc/mod.rs).
#
# Rust's own allocating APIs are either infallible - they abort the process on
# OOM, which for a library inside someone's application server is not "failing
# closed" - or they are fallible but invisible to `rake oom`, which can only
# fail allocations that consult the injection counter. `falloc` fixes both, and
# this list is what keeps a new call site from quietly going around it.
#
# Scope is deliberate. Banned here are the ways a NEW owning container comes
# into existence or grows its capacity, because those are unambiguous, plus the
# shrinking methods below, whose normal shape is "reserve exact and never
# shrink". `push`, `insert`, `extend` and `resize`/`resize_with` are NOT banned:
# after a successful reserve they cannot allocate, and that is the normal shape
# of the code.
#
# So one residual risk is left uncovered on purpose, and it is stated here
# rather than deferred to a document: a `push`, `insert`, `extend` or
# `resize`/`resize_with` with no reserve in front of it allocates infallibly and
# the sweep cannot fail it. Banning them would need an allow on every second
# line, which buys nothing - `falloc`'s VecPush / MapInsert exist so the reserve
# and the write are one call, and review is what catches a site that skipped
# them. Every `resize`/`resize_with` in the tree today already sits behind a
# falloc reserve (ptr_table, dom_index, arena, eval, serialize/bindings), so the
# exposure is a future site, not a live one.
disallowed-methods = [
  { path = "std::boxed::Box::new", reason = "aborts on OOM; use falloc::try_box" },
  # `to_vec` is the same allocation as `Vec::from` under a friendlier name, and
  # it was one of the holes this list had. Its sibling `ToOwned::to_owned` is NOT
  # banned here, because it cannot be: on a `&str` it builds the String of a Ruby
  # exception message, which the glue is right to allocate infallibly on a path
  # that is already raising. The rule is per-LAYER and clippy.toml is crate-wide,
  # so the layer half lives in `script/check_unsafe_boundaries.rb` ("infallible
  # allocation inside an engine layer"), beside the other per-layer gates.
  { path = "slice::to_vec", reason = "aborts on OOM; use falloc::try_to_vec" },
  { path = "alloc::vec::Vec::with_capacity", reason = "aborts on OOM; use falloc::try_vec_with_capacity" },
  { path = "alloc::vec::Vec::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "alloc::vec::Vec::reserve_exact", reason = "aborts on OOM; use Reserve::falloc_reserve_exact" },
  { path = "alloc::vec::Vec::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "alloc::vec::Vec::try_reserve_exact", reason = "not injectable; use Reserve::falloc_reserve_exact" },
  # Shrinking is not a no-op: when capacity exceeds the target, `shrink_to_fit`
  # / `shrink_to` / `String::shrink_to_fit` REALLOCATE the buffer downwards and
  # abort on failure (verified with a failing global allocator), so they are
  # outside the sweep like any grow. They only reallocate when capacity > len;
  # the blessed shape is to reserve exactly and never need to shrink.
  { path = "alloc::vec::Vec::shrink_to_fit", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  { path = "alloc::vec::Vec::shrink_to", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  { path = "alloc::string::String::shrink_to_fit", reason = "reallocs and aborts on OOM; reserve exact and never grow past len" },
  # `into_boxed_slice` shrinks to `len` before converting, so it aborts the same
  # way. Its `From<Vec<T>>` / `.into()` conversion spellings reach the same code
  # and cannot be named here - the type-level half of this one lives in
  # `falloc::try_to_boxed_slice` and the ban keeps the method name out of a new
  # site.
  { path = "alloc::vec::Vec::into_boxed_slice", reason = "reallocs and aborts on OOM; use falloc::try_to_boxed_slice" },
  { path = "std::collections::HashMap::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashMap::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "std::collections::HashMap::with_capacity", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::reserve", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::try_reserve", reason = "not injectable; use Reserve::falloc_reserve" },
  { path = "std::collections::HashSet::with_capacity", reason = "aborts on OOM; use Reserve::falloc_reserve" },
  # std's STABLE sorts take a scratch buffer from the global allocator and abort
  # the process when it cannot be had - outside falloc, so `rake oom` never
  # fails them. The unstable sorts sort in place and allocate nothing.
  { path = "slice::sort", reason = "allocates and aborts on OOM; use sort_unstable" },
  { path = "slice::sort_by", reason = "allocates and aborts on OOM; use sort_unstable_by" },
  { path = "slice::sort_by_key", reason = "allocates and aborts on OOM; use sort_unstable_by_key" },
  { path = "slice::sort_by_cached_key", reason = "allocates and aborts on OOM; sort in place" },
  # magnus's constructors and growers RAISE on a failed allocation - a
  # `longjmp` over the caller's frames - and its `funcall`/`respond_to?`/`eql?`
  # family runs the caller's Ruby. `bridge::build` and `bridge::string` spell
  # every allocation through `bridge::raw`'s protected calls instead, so a
  # failure is `Err`; init (`Init_makiri`, where a raise is `require`'s) and
  # the two calls `rake unsafe:boundaries` allows (`USER_CODE_API`) carry an
  # `#[allow]` with a reason.
  { path = "magnus::Ruby::ary_new", reason = "raises on OOM; use bridge::build::ary" },
  { path = "magnus::Ruby::ary_new_capa", reason = "raises on OOM; use bridge::build::ary" },
  { path = "magnus::Ruby::ary_new_from_values", reason = "raises on OOM; use bridge::build::ary + push" },
  { path = "magnus::Ruby::ary_from_iter", reason = "raises on OOM; use bridge::build::ary + push" },
  { path = "magnus::Ruby::ary_from_vec", reason = "raises on OOM; use bridge::build::ary + push" },
  { path = "magnus::Ruby::hash_new", reason = "raises on OOM; use bridge::build::hash" },
  { path = "magnus::Ruby::hash_new_capa", reason = "raises on OOM; use bridge::build::hash" },
  { path = "magnus::Ruby::integer_from_i64", reason = "raises on OOM; use bridge::build::int" },
  { path = "magnus::Ruby::integer_from_u64", reason = "raises on OOM; use bridge::build::uint" },
  { path = "magnus::Ruby::float_from_f64", reason = "raises on OOM; use bridge::build::float" },
  { path = "magnus::Ruby::sym_new", reason = "raises on OOM; use bridge::build::sym" },
  { path = "magnus::Ruby::to_symbol", reason = "raises on OOM; use bridge::build::sym" },
  { path = "magnus::Ruby::str_new", reason = "raises on OOM; use bridge::string::utf8_str" },
  { path = "magnus::Ruby::str_from_slice", reason = "raises on OOM; use bridge::string::utf8_str" },
  { path = "magnus::Ruby::str_with_capacity", reason = "raises on OOM; use bridge::string::utf8_str_from_slices" },
  { path = "magnus::Ruby::str_buf_new", reason = "raises on OOM; use bridge::string::utf8_str_from_slices" },
  { path = "magnus::Ruby::enc_str_new", reason = "raises on OOM; use bridge::string" },
  { path = "magnus::Ruby::wrap", reason = "raises on OOM; use bridge::typed" },
  { path = "magnus::Ruby::wrap_as", reason = "raises on OOM; use bridge::typed" },
  { path = "magnus::RString::new", reason = "raises on OOM; use bridge::string::utf8_str" },
  { path = "magnus::RString::from_slice", reason = "raises on OOM; use bridge::string::utf8_str" },
  { path = "magnus::RString::with_capacity", reason = "raises on OOM; use bridge::string::utf8_str_from_slices" },
  { path = "magnus::RString::buf_new", reason = "raises on OOM; use bridge::string::utf8_str_from_slices" },
  { path = "magnus::RString::cat", reason = "raises on OOM; use bridge::string::utf8_str_from_slices" },
  { path = "magnus::RArray::push", reason = "goes through magnus's protect; use bridge::build::push" },
  { path = "magnus::RArray::store", reason = "goes through magnus's protect; use bridge::build::push" },
  { path = "magnus::RHash::aset", reason = "goes through magnus's protect; use bridge::build::aset" },
  { path = "magnus::value::ReprValue::funcall", reason = "runs the caller's Ruby; Makiri runs none" },
  { path = "magnus::value::ReprValue::funcall_public", reason = "runs the caller's Ruby; Makiri runs none" },
  { path = "magnus::value::ReprValue::check_funcall", reason = "runs the caller's Ruby; Makiri runs none" },
  { path = "magnus::value::ReprValue::funcall_with_block", reason = "runs the caller's Ruby; Makiri runs none" },
  { path = "magnus::value::ReprValue::respond_to", reason = "runs the caller's Ruby; Makiri runs none" },
  { path = "magnus::value::ReprValue::to_r_string", reason = "runs the caller's to_s; use bridge::ruby::string_arg" },
  { path = "magnus::value::ReprValue::eql", reason = "runs the caller's eql?; compare by identity (bridge::ruby::same_value)" },
  { path = "magnus::value::ReprValue::equal", reason = "runs the caller's ==; compare by identity (bridge::ruby::same_value)" },
  { path = "magnus::value::ReprValue::inspect", reason = "runs the caller's inspect" },
  { path = "magnus::value::ReprValue::enumeratorize", reason = "raises on OOM; use bridge::build::enumerator" },
]
