[package]
name = "nupur_sys"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Ruby's C API for Nupur: the one crate under it that depends on rb-sys"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Deliberately WITHOUT `link-ruby`: the extension is dlopen'd into a Ruby that
# already provides the rb_* symbols. The features are the ones Nupur was
# written against: the `rbimpl_*` flag enums, the struct layouts (`RBasic`,
# for a String's coderange flags) and the stable API.
rb-sys = { version = "0.9", features = [
    "bindgen-rbimpls",
    "bindgen-deprecated-types",
    "stable-api",
] }
