[package]
name = "nupur"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false
description = "A Ruby binding layer for extensions in Rust: values, exceptions, method trampolines, TypedData and the GVL, over rb-sys (written for Makiri)"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The hooks of `rake oom`: the extension installs both (`inject::install`) -
# one makes the armed allocating call raise, the other fails a checked
# copy's heap buffer. Off, the checks are gone. The extension's own `alloc-inject` turns this on.
alloc-inject = ["nupur_sys/alloc-inject"]

[dependencies]
# Ruby's C API, through the one crate that depends on rb-sys (`sys/`): Nupur
# names `nupur_sys::`, never rb-sys.
nupur_sys = { path = "sys", version = "0.0.1" }
