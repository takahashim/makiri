[package]
name = "nupur"
version = "0.0.1"
edition = "2021"
rust-version = "1.84"
publish = false
description = "The Ruby binding layer under the Makiri extension: values, exceptions, method trampolines, TypedData and the GVL, over rb-sys"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The raise half of `rake oom`: the extension registers a hook
# (`raw::set_raise_injector`) that makes the armed allocating call raise.
# Off, the check is gone. The extension's own `alloc-inject` turns this on.
alloc-inject = []

[dependencies]
# Deliberately WITHOUT `link-ruby`: the extension is dlopen'd into a Ruby that
# already provides the rb_* symbols. The features are the ones the layer was
# written against: the `rbimpl_*` flag enums, the struct layouts (`RBasic`,
# for a String's coderange flags) and the stable API.
rb-sys = { version = "0.9", features = [
    "bindgen-rbimpls",
    "bindgen-deprecated-types",
    "stable-api",
] }
