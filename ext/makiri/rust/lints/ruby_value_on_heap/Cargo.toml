[package]
name = "ruby_value_on_heap"
version = "0.1.0"
description = "Makiri's lint: a Ruby value kept where Ruby's GC cannot see it"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true
