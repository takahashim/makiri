[package]
name = "nupur_lints"
version = "0.1.0"
description = "Nupur's lints over a Ruby extension's boundary: the layer's guarantees, for the layer and any extension on it"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { workspace = true }
dylint_linting = { workspace = true }
serde = { version = "1", features = ["derive"] }

[package.metadata.rust-analyzer]
rustc_private = true
