[package]
name = "makiri_lints"
version = "0.1.0"
description = "Makiri's own lint over its Ruby boundary"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

# A crate of its own, not a member of the extension's workspace (its own
# toolchain, run from its own directory).
[workspace]
