name: libFuzzer

on:
  # Nightly: libFuzzer runs are coverage-guided and long-running; they complement
  # the PR-level short fuzz (30s) and the nightly sanitizer fuzz (300s per target).
  # We run them on a schedule because the coverage signal needs sustained CPU
  # time to reach deep branches (e.g. DOCTYPE quote/bracket state machine,
  # reference expansion boundaries).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # The surfaces, coverage-guided, under cargo-fuzz.
  #
  # A second job stood beside this one and fuzzed the same three XML/XPath
  # surfaces as C binaries built by ext/makiri/fuzz/Makefile under clang.
  # Both were shipped code while the port was in progress; only one is now,
  # and the C harnesses went with the sources they drove. The corpus cache
  # key is unchanged, so the accumulated seeds carry over.
  cargo-fuzz-nightly:
    name: cargo-fuzz ${{ matrix.target }} (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # html_css and html_css_diff run in css-match.yml, with the selector
        # dictionary and a longer budget.
        target: [xml, xpath, xml_xpath, css, html, html_xpath, html_diff, selector_diff, stylesheet_diff]

    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # -Zsanitizer is unstable, and cargo-fuzz needs it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The targets need the reference Lexbor `rake lexbor` builds - the crate's
      # build.rs links the archive and generates bindings from the headers.
      - name: Build the reference Lexbor
        run: bundle exec rake lexbor

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The fuzz crate inherits the allocation lint from ../clippy.toml, and it
      # was firing there unseen: nothing built this crate with -D warnings.
      - name: Clippy the fuzz crate
        working-directory: ext/makiri/rust/fuzz
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the fuzz targets
        working-directory: ext/makiri/rust/fuzz
        run: cargo fuzz build ${{ matrix.target }}

      # A green fuzz run proves nothing if the sanitizer is inert, and the
      # obvious check for that (nm -u | grep __asan_report) reads 0 on Linux
      # whether or not the binary is instrumented, because the runtime is
      # linked statically. Assert on the full symbol table instead.
      - name: Assert the target is instrumented
        working-directory: ext/makiri/rust/fuzz
        run: |
          bin=$(ls target/*/release/${{ matrix.target }})
          reports=$(nm "$bin" | grep -c '__asan_report')
          echo "$bin: __asan_report symbols = $reports"
          test "$reports" -gt 0 || { echo "not ASan-instrumented"; exit 1; }

      - name: Restore corpus cache
        uses: actions/cache@v6
        with:
          path: ext/makiri/rust/fuzz/corpus/${{ matrix.target }}
          key: cargo-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            cargo-fuzz-corpus-${{ matrix.target }}-

      - name: Run cargo-fuzz ${{ matrix.target }} (300s)
        working-directory: ext/makiri/rust/fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=300 \
            -max_len=4096 \
            -print_final_stats=1

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-corpus-${{ matrix.target }}
          path: ext/makiri/rust/fuzz/corpus/${{ matrix.target }}
          retention-days: 7

      # Anything cargo-fuzz saved under artifacts/ is a reproducer.
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-artifacts-${{ matrix.target }}
          path: ext/makiri/rust/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30

  # The same surfaces, hunting for SLOW inputs rather than crashes: what an
  # attacker reaches with an input whose cost grows faster than its size.
  # Without a sanitizer (`-s none`), so time means something; inputs up to
  # 64 KB with no length ramp, so a quadratic path costs seconds rather than
  # milliseconds; and any one input over 5 s fails the run, its reproducer
  # saved as a `timeout-*` artifact. Every engine budget (XPath's op count,
  # CSS's work budget, the depth and amplification limits) stops a bounded
  # amount of work well inside that. spec/input_cost_spec.rb pins the shapes
  # already found.
  cargo-fuzz-slow-inputs:
    name: slow inputs ${{ matrix.target }} (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [html, xml, xpath, xml_xpath, html_xpath, html_css, css]

    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build the reference Lexbor
        run: bundle exec rake lexbor

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Seeded from the crash-hunting job's corpus, which covers the grammar.
      - name: Restore corpus cache
        uses: actions/cache/restore@v6
        with:
          path: ext/makiri/rust/fuzz/corpus/${{ matrix.target }}
          key: cargo-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            cargo-fuzz-corpus-${{ matrix.target }}-

      - name: Run cargo-fuzz ${{ matrix.target }} for slow inputs (600s)
        working-directory: ext/makiri/rust/fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo fuzz run -s none --release ${{ matrix.target }} -- \
            -max_total_time=600 \
            -max_len=65536 \
            -len_control=0 \
            -timeout=5 \
            -print_final_stats=1

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-inputs-${{ matrix.target }}
          path: ext/makiri/rust/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
