name: Valgrind + GC.compact

on:
  # Valgrind memcheck runs nightly (and by hand): it is the only check without a
  # frequency threshold (any "definitely lost" / uninitialised-value use fails,
  # unlike the PR-level macOS leak gate, which only flags stacks repeated >=30x).
  # It also ran on every push to main while the extension carried C; with the
  # crate's unsafe confined to reviewed islands (`rake unsafe:boundaries`) and
  # ASan on every PR, a nightly run is enough to catch a leak on a rarely-hit
  # error path within a day.
  #
  # The GC.stress job also runs on pull requests (see its `if:` below). It was
  # nightly-only on the reasoning that it checks structural properties that do
  # not vary with day-to-day churn, but a schedule runs on the default branch
  # only, so a branch could carry a GC-graph bug it never saw: the Rust port did
  # (a VALUE stored in a wrapper struct before the wrap, freed by the GC there).
  # It runs only the :gc_compact examples, so it is cheap enough for a PR.
  # Valgrind memcheck stays off pull requests, as above.
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      valgrind_options:
        description: "Extra Valgrind options, e.g. --expensive-definedness-checks=yes"
        required: false
        default: ""

# A new push to a pull request supersedes the run on its previous head. The
# event is in the group so a pull request never replaces a nightly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Valgrind memcheck on the full spec suite.  Complements ASan by catching
  # layout-independent errors ASan misses: use of uninitialised values, and
  # invalid reads/writes that happen to land inside valid malloc regions
  # (intra-arena overflows).  Runs on Linux because Valgrind is x86_64/amd64
  # Linux only.
  valgrind-memcheck:
    # Nightly and by hand; not on pull requests (see the note under `on:`).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Valgrind memcheck (Ruby ${{ matrix.ruby }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUNDLE_WITH: valgrind
      # Shard the suite across the matrix below: 4 parallel jobs each memcheck a
      # quarter of the spec files, so the whole suite finishes in ~1/4 the
      # wall-clock with no loss of coverage (each shard is balanced by file size).
      VALGRIND_SHARDS: "4"
      VALGRIND_SHARD_INDEX: ${{ matrix.shard }}
      # These heavy jobs verify memory discipline (uninit values, intra-arena
      # overflows, use-after-move), not the property space - so the full
      # 300-iteration PBT sweep (already run by the normal CI matrix) is
      # overkill here and, multiplied by Valgrind's 10-50x slowdown, never
      # finishes.  A handful of iterations exercises every memory path while
      # keeping the run tractable.
      PBT_COUNT: "15"
      CSS_PBT_COUNT: "15"
      # --track-origins roughly doubles memcheck's runtime and only adds an origin
      # backtrace to a finding; the nightly run keeps it, for triage.
      VALGRIND_TRACK_ORIGINS: "yes"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
        shard: [0, 1, 2, 3]   # keep in sync with VALGRIND_SHARDS above

    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The extension is a Rust crate; cargo is part of the build now.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile the extension
        run: bundle exec rake compile

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # ruby_memcheck (the `spec:valgrind` rake task) runs the suite under
      # memcheck. It ships Ruby's Valgrind suppression files itself (matched to
      # the running Ruby), so there is no longer a ruby.supp to fetch from
      # ruby/ruby - that path was removed upstream and the fetch step 404'd.
      - name: Run spec suite under Valgrind (ruby_memcheck)
        env:
          # Gzipped copies of Valgrind's XML, uploaded when the job fails: it
          # holds each error's origin, which ruby_memcheck's report does not.
          VALGRIND_XML_KEEP: ${{ github.workspace }}/valgrind-xml
          # A manual run's extra options (see `on.workflow_dispatch`).
          VALGRIND_EXTRA: ${{ github.event.inputs.valgrind_options }}
        run: bundle exec rake spec:valgrind

      # On ubuntu-26.04 (Valgrind 3.26.0) ruby_memcheck 3.0.1 failed on every
      # shard reading Valgrind's XML, after all the examples had passed:
      # "Opening and ending tag mismatch: still_reachable ... and leak_summary".
      # ruby_memcheck deletes the XML only once it has parsed it, so a failure
      # leaves it in /tmp. Show where each file is malformed, and keep those
      # files (gzipped), to see what Valgrind wrote.
      - name: Show the Valgrind XML that did not parse
        if: failure()
        run: |
          sudo apt-get install -y libxml2-utils >/dev/null
          valgrind --version
          mkdir -p valgrind-xml
          for f in /tmp/d*/*.xml; do
            [ -f "$f" ] || continue
            if ! out=$(xmllint --noout --huge "$f" 2>&1); then
              echo "::group::$f"
              echo "$out" | head -5
              line=$(echo "$out" | sed -n 's/^[^:]*:\([0-9]*\): parser error.*/\1/p' | head -1)
              if [ -n "$line" ]; then
                start=$((line > 40 ? line - 40 : 1))
                sed -n "${start},$((line + 10))p" "$f"
              fi
              echo "::endgroup::"
              gzip -c "$f" > "valgrind-xml/$(basename "$f").gz"
            fi
          done
          ls -la valgrind-xml

      - name: Upload the malformed Valgrind XML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-xml-${{ matrix.ruby }}-shard-${{ matrix.shard }}
          path: valgrind-xml
          if-no-files-found: ignore

  # GC.auto_compact + GC.stress over the GC-sensitive examples.  This
  # structurally tests the borrowed-pointer discipline under the condition that
  # Ruby Strings actually move (compaction) and that every allocation triggers a
  # full GC cycle (stress).  Failures here are typically use-after-move or stale
  # pointer bugs in the extension or bridge layer.
  #
  # Scope: only the examples tagged `:gc_compact` (the `memory safety` blocks in
  # css/xpath/serialize/mutation/source_location/api_compat2 +
  # attribute's lazy-index example).  Those are the examples written to exercise
  # the borrowed-pointer paths.  `GC_COMPACT_STRESS=1` makes spec_helper set
  # `GC.auto_compact = true` process-wide and wrap every example in `GC.stress`,
  # so each allocation inside a tagged example triggers a *compacting* GC - the
  # strongest form of the use-after-move test.  The high-volume churn loops
  # (parse/drop cycles) scale their iteration count down under stress
  # (`gc_churn_iters` / `GC_COMPACT_ITERS`) because each stressed iteration is
  # orders of magnitude heavier; `GC_COMPACT_ITERS` below tunes the total runtime
  # (~14.5 min on CI at 200 in one job, hence the shards below; 100 now,
  # with the compaction examples scaled the same way - the `rest` shard went
  # from ~5.7 to ~3 min locally, and CI's runners vary by 2x either way).  An
  # earlier version forced GC.stress onto the *entire* suite (~800 examples): it ran 1h40m+ and never finished, while
  # testing borrowed-pointer discipline on hundreds of examples that have none.
  # The rest of the suite still runs in ci.yml.
  #
  # THREADING is deliberately OFF here.  The :threading suite is 8 threads x tens
  # of iterations; it runs in ci.yml and its GC-sensitive examples opt into
  # GC.stress themselves, so cross-thread interactions are covered there.
  gc-compact-stress:
    # Pull requests, nightly and on demand. See the note under `on:` for why
    # pull requests.
    name: GC.auto_compact + GC.stress (Ruby ${{ matrix.ruby }}, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GC_COMPACT_STRESS: "1"
      # Per-iteration cost under per-allocation compacting GC is ~1000x normal, so
      # the churn loops run this many iterations (vs their normal 200-1000). Tunes
      # the job's runtime; raise for more coverage, lower if it approaches the
      # timeout.
      GC_COMPACT_ITERS: "100"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
        # Split by spec file. There were three shards while the XPath handler
        # spec, a third of the runtime on its own, existed; it went with the
        # handlers. The last shard is everything ELSE, so a newly tagged file
        # lands there rather than in no shard. It is the long one (~22 min of
        # the 30-minute timeout on 2026-10-24, against ~3 for `attribute`):
        # split it before it reaches the timeout.
        shard:
          - name: attribute
            args: spec/attribute_spec.rb spec/source_location_spec.rb
          - name: rest
            args: --exclude-pattern "spec/{attribute,source_location}_spec.rb" spec

    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The extension is a Rust crate; cargo is part of the build now.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile the extension
        run: bundle exec rake compile

      # GC_COMPACT_STRESS=1 (set in env above) makes spec_helper enable
      # auto_compact globally and wrap each example in GC.stress; --tag gc_compact
      # limits the run to the borrowed-pointer examples.
      - name: Run GC-sensitive examples under GC.auto_compact + GC.stress
        run: bundle exec rspec --tag gc_compact ${{ matrix.shard.args }}
