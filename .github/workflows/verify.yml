name: Verify

on:
  push:
    # `rust` too: the branch carries the port, and a source split that left
    # verify/Makefile behind went unnoticed for exactly this reason - the
    # workflow never ran here, and a stale verify/build/ hid it locally.
    branches: [main, master, rust]
  pull_request:
  workflow_dispatch:

jobs:
  cbmc:
    name: CBMC proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install CBMC
        env:
          CBMC_VERSION: "6.9.0"
        run: |
          curl -fsSLO "https://github.com/diffblue/cbmc/releases/download/cbmc-${CBMC_VERSION}/ubuntu-24.04-cbmc-${CBMC_VERSION}-Linux.deb"
          sudo apt-get update
          sudo apt-get install -y "./ubuntu-24.04-cbmc-${CBMC_VERSION}-Linux.deb"
          cbmc --version

      - name: Run verification suite
        run: bundle exec rake verify

  # Kani is to the Rust half what CBMC is to the C half above. Separate job, and
  # deliberately not folded into `rake verify`: the two prove different code.
  # The CBMC harnesses compile ext/makiri/{core,xml,xpath}/*.c directly, which a
  # MAKIRI_RUST_* build does not execute - so `rake verify` staying green said
  # nothing about the Rust engine, and still does not. Which proof replaces
  # which is written down in notes/rust_port_remaining.ja.md.
  kani:
    name: Kani proofs (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Kani pins its own Rust toolchain, so no rust-toolchain step here.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
          cargo kani --version

      # No `rake compile` first: these proofs are over the Ruby- and
      # Lexbor-free features, which is the whole reason Kani can build them.
      - name: Run the Kani proofs
        run: bundle exec rake kani
