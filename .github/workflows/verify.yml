name: Verify

on:
  # Up to ten minutes of proofs, over the Ruby-free engine only - so they run
  # when that engine (or how it is built) changes, not on every push, and then
  # only the groups whose code changed (see "Pick the proof groups").
  push:
    branches: [main, master]
    paths: &kani-paths
      # The proofs build `--no-default-features`, so the Ruby/Lexbor layers
      # below are compiled out of them; a change confined to those cannot
      # change a proof's outcome. Everything else under src/ stays in, since
      # the harnesses reach the engine's shared modules (limits, text, ...).
      - "ext/makiri/rust/src/**"
      - "!ext/makiri/rust/src/bridge/**"
      - "!ext/makiri/rust/src/glue/**"
      - "!ext/makiri/rust/src/lexbor/**"
      - "!ext/makiri/rust/src/css/**"
      - "!ext/makiri/rust/src/init.rs"
      - "ext/makiri/rust/build.rs"
      - "ext/makiri/rust/Cargo.toml"
      - "ext/makiri/rust/Cargo.lock"
      - "Rakefile"
      - ".github/workflows/verify.yml"
  pull_request:
    paths: *kani-paths
  # Every group, whatever changed: the safety net for a dependency the groups
  # in the Rakefile (KANI_GROUPS) missed.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head. The
# event is in the group so a push to main never queues behind (or replaces) a
# nightly run of the same workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A CBMC job stood here and proved ext/makiri/{core,xml,xpath}/*.c. Those
  # files are gone, and `rake verify` with them: every one of its fifteen
  # harnesses compiled one of them, and the three that linked none proved
  # `static inline` code in the same headers - there was nothing left to point
  # CBMC at.
  #
  # Kani is the successor and deliberately not a rename: the two tools prove
  # different things about different code, and which Kani proof replaces which
  # CBMC one - and what changed in the translation - is written down rather than
  # assumed. Not all the answers are "the same property".
  kani:
    name: Kani proofs (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The base of the change, for the diff below.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Only the groups whose code changed (`rake kani:groups`, which also
      # fails on a proof in no group): the allocator's group alone is ~6
      # minutes and its code rarely changes. A schedule or manual run, or a
      # push with no previous commit to diff against, takes every group.
      - name: Pick the proof groups
        id: groups
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            groups=$(printf 'Rakefile\n' | bundle exec rake -s kani:groups)
          else
            groups=$(git diff --name-only "$base" HEAD | bundle exec rake -s kani:groups)
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Kani groups: ${groups:-(none)}"

      # Kani pins its own Rust toolchain, so no rust-toolchain step here.
      - name: Install Kani
        if: steps.groups.outputs.groups != ''
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
          cargo kani --version

      # No `rake compile` first: these proofs are over the Ruby- and
      # Lexbor-free features, which is the whole reason Kani can build them.
      # Four jobs: the runner's cores, so the run takes about its slowest
      # harness rather than the sum.
      - name: Run the Kani proofs
        if: steps.groups.outputs.groups != ''
        env:
          KANI_GROUPS: ${{ steps.groups.outputs.groups }}
          KANI_JOBS: "4"
        run: bundle exec rake kani

  # Miri over the Ruby-free modules that hold `unsafe` (`raw_vec`, `falloc`)
  # and the buffer built on them (`cbuf`): their tests run on Miri's
  # interpreter, which reports undefined behaviour - an out-of-bounds or
  # dangling access, a misaligned or provenance-less pointer - that a test on
  # hardware passes over. Kani proves the same code bounded; this runs it
  # unbounded. `bridge/` needs Ruby and is not here.
  miri:
    name: Miri (Ruby-free unsafe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri setup

      - name: Run the tests under Miri
        working-directory: ext/makiri/rust
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: cargo +nightly miri test --no-default-features --lib -- raw_vec:: falloc:: cbuf::
