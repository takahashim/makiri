name: Verify

on:
  # Proofs and exhaustive tests over the Ruby-free engine only - so they run
  # when that engine (or how it is built) changes, not on every push.
  push:
    branches: [main, master]
    paths: &verify-paths
      # The engine alone, with no feature: a change to the extension or the
      # Lexbor reference cannot change these outcomes. Every engine module
      # stays in, since the proofs reach its shared modules (limits, text,
      # ...), and so does falloc, which it allocates through. Three nupur
      # files are checked here as well: Miri runs `utf8_copy` inside falloc's
      # test build, and `rake verus:sync` holds `copy_small` in
      # `string/make.rs` and the conversions in `int.rs` to the Verus proofs.
      - "ext/makiri/rust/engine/**"
      - "ext/makiri/rust/falloc/**"
      - "ext/makiri/rust/nupur/src/utf8_copy.rs"
      - "ext/makiri/rust/nupur/src/string/make.rs"
      - "ext/makiri/rust/nupur/src/int.rs"
      - "ext/makiri/rust/verus/**"
      - "ext/makiri/rust/Cargo.toml"
      - "ext/makiri/rust/Cargo.lock"
      - "Rakefile"
      - "rakelib/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths: *verify-paths
  # Whatever changed: the safety net for a dependency the paths above miss.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head. The
# event is in the group so a push to main never queues behind (or replaces) a
# nightly run of the same workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests that run every input of their domain (`rake rust:exhaustive`):
  # `decode1` against `core::str::from_utf8` on every buffer of up to four
  # bytes, the one claim about the decoder Verus cannot state, since it has
  # no contract for `from_utf8`. A Kani job stood here and proved it, with
  # the bounded harnesses verus/ now proves at every length; a CBMC job
  # before that, over the C.
  exhaustive:
    name: Exhaustive tests (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Run the exhaustive tests
        run: bundle exec rake rust:exhaustive

  # Miri over the Ruby-free code that holds `unsafe` - the `falloc` crate,
  # with `nupur::utf8_copy` included in its test build: their tests run on
  # Miri's interpreter, which reports undefined behaviour - an out-of-bounds
  # or dangling access, a misaligned or provenance-less pointer - that a test
  # on hardware passes over. The engine forbids `unsafe`, and nupur's
  # Ruby-facing `unsafe` needs a Ruby.
  miri:
    name: Miri (Ruby-free unsafe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri setup

      - name: Run the tests under Miri
        working-directory: ext/makiri/rust
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        # Quoted: an unquoted `name:: ` would be read as a YAML mapping.
        run: "cargo +nightly miri test -p falloc --lib"

  # Verus over ext/makiri/rust/verus/: `falloc::grow_capacity`,
  # `ptr_table`, `ceiling_buf::Buf`, `limits::admit`, the UTF-8 decoder with
  # the XML Char scan, the XML character classes and `xpath::number::extent`
  # (copied, and checked against the source by `rake verus:sync`), at every
  # length, each with canaries
  # that must fail. Verus is a pinned release
  # (rakelib/verus.rake's VERUS_VERSION) and brings the Rust toolchain it names.
  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERUS_VERSION: "0.2026.10.04.426d8b0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Verus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/verus" && cd "$RUNNER_TEMP/verus"
          gh release download "release/$VERUS_VERSION" -R verus-lang/verus \
            -p "verus-$VERUS_VERSION-x86-linux.zip"
          unzip -q "verus-$VERUS_VERSION-x86-linux.zip"
          # The message is coloured: take the toolchain name as its characters,
          # so no escape sequence comes with it.
          toolchain=$( (./verus-x86-linux/verus --version 2>&1 || true) \
            | grep -oE 'rustup install [0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+(-[A-Za-z0-9_]+)*' \
            | head -1 | sed 's/^rustup install //')
          if [ -n "$toolchain" ]; then rustup install "$toolchain" --profile minimal; fi
          ./verus-x86-linux/verus --version
          echo "VERUS=$RUNNER_TEMP/verus/verus-x86-linux/verus" >> "$GITHUB_ENV"

      - name: Run the Verus proofs
        run: bundle exec rake verus
