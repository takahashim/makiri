name: CSS matcher

# The HTML CSS matcher (`lexbor::css_match`) on its own: it answers every
# `Node#css` / `#at_css` / `#matches?`, and its failure mode is not a crash
# but a wrong answer, which the general suites only catch by example. Two
# checks, both against the OLD engine - Lexbor's own `lxb_selectors`, kept as
# `lexbor::selectors` for exactly this:
#
#   - the randomized differential tests in `lexbor::tests::css_match`, run long
#     with a fresh seed (MAKIRI_CSS_DIFF_SEED; a failure prints it);
#   - the cargo-fuzz targets `html_css` (memory safety, and the three entry
#     points agreeing) and `html_css_diff` (agreement with Lexbor's engine),
#     with the selector dictionary.
#
# A PR that touches the matcher, the Lexbor layer or the pin gets a short run;
# the nightly one is long. A disagreement on a shape where css_match departs
# from Lexbor on purpose is not a finding: the departures are listed in
# `css_match`'s module doc, and both checks leave them out.

on:
  push:
    branches: [main, master]
    paths:
      - "ext/makiri/rust/src/lexbor/**"
      - "ext/makiri/rust/fuzz/**"
      - "ext/makiri/rust/Cargo.toml"
      - "vendor/lexbor"
      - ".github/workflows/css-match.yml"
  pull_request:
    paths:
      - "ext/makiri/rust/src/lexbor/**"
      - "ext/makiri/rust/fuzz/**"
      - "ext/makiri/rust/Cargo.toml"
      - "vendor/lexbor"
      - ".github/workflows/css-match.yml"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

env:
  # Short on a push or PR, long on the nightly schedule.
  LONG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  differential:
    name: Randomized differential (vs Lexbor's engine)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # build.rs links the vendored Lexbor archive and reads its headers.
      - name: Compile the extension (builds Lexbor)
        run: bundle exec rake compile

      # Release: the sweep is the point, and debug is ~10x slower. The seed is
      # fresh per run, so a long series covers new ground; it is printed here
      # and in any failure, so a finding reproduces.
      - name: Run the css_match tests with a fresh seed
        working-directory: ext/makiri/rust
        run: |
          export MAKIRI_CSS_DIFF_SEED=$(printf '0x%x' $(( (GITHUB_RUN_ID * 2654435761 + GITHUB_RUN_ATTEMPT) & 0xffffffffffff )))
          if [ "$LONG" = true ]; then
            export MAKIRI_CSS_DIFF_ITERATIONS=1000000
          else
            export MAKIRI_CSS_DIFF_ITERATIONS=20000
          fi
          echo "MAKIRI_CSS_DIFF_SEED=$MAKIRI_CSS_DIFF_SEED MAKIRI_CSS_DIFF_ITERATIONS=$MAKIRI_CSS_DIFF_ITERATIONS"
          cargo test --release --no-default-features --features lexbor -- \
            lexbor::tests::css_match lexbor::tests::selector_cache

  fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [html_css, html_css_diff]
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # -Zsanitizer is unstable, and cargo-fuzz needs it.
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install libclang (bindgen, via rb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile the extension (builds Lexbor)
        run: bundle exec rake compile

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build the fuzz target
        working-directory: ext/makiri/rust/fuzz
        run: cargo fuzz build ${{ matrix.target }}

      # As in libfuzzer.yml: nm -u reads 0 on Linux whether or not the binary
      # is instrumented, so assert on the full symbol table.
      - name: Assert the target is instrumented
        working-directory: ext/makiri/rust/fuzz
        run: |
          bin=$(ls target/*/release/${{ matrix.target }})
          reports=$(nm "$bin" | grep -c '__asan_report')
          echo "$bin: __asan_report symbols = $reports"
          test "$reports" -gt 0 || { echo "not ASan-instrumented"; exit 1; }

      # Both targets read the same `selector NUL document` input, so each
      # also starts from the other's corpus (read-only: new units go to the
      # first directory). The cache prefix is libfuzzer.yml's, so the corpus
      # accumulated there carries over.
      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: ext/makiri/rust/fuzz/corpus/${{ matrix.target }}
          key: cargo-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            cargo-fuzz-corpus-${{ matrix.target }}-

      - name: Restore the sibling corpus
        uses: actions/cache/restore@v6
        with:
          path: ext/makiri/rust/fuzz/corpus/${{ matrix.target == 'html_css' && 'html_css_diff' || 'html_css' }}
          key: cargo-fuzz-corpus-${{ matrix.target == 'html_css' && 'html_css_diff' || 'html_css' }}-${{ github.run_id }}
          restore-keys: |
            cargo-fuzz-corpus-${{ matrix.target == 'html_css' && 'html_css_diff' || 'html_css' }}-

      # -timeout: html_css_diff runs Lexbor's exhaustively backtracking engine
      # too; the harness skips inputs it cannot afford, and this is the stop
      # for one it misjudged.
      - name: Run cargo-fuzz ${{ matrix.target }}
        working-directory: ext/makiri/rust/fuzz
        run: |
          sibling=${{ matrix.target == 'html_css' && 'html_css_diff' || 'html_css' }}
          mkdir -p corpus/${{ matrix.target }} corpus/$sibling
          if [ "$LONG" = true ]; then seconds=3600; else seconds=180; fi
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} corpus/$sibling -- \
            -max_total_time=$seconds \
            -max_len=4096 \
            -timeout=30 \
            -dict=css.dict \
            -print_final_stats=1

      # The cache saves this directory after every run, so without this it
      # only grows: every nightly hour adds units and nothing ever drops one.
      # It reached ~58k files (with the sibling, ~107k units replayed before
      # the first mutation) of which libFuzzer kept ~2.8k, and a short run
      # spent its whole 180 s replaying - 0 new units, no fuzzing at all.
      # Minimizing before the save keeps only what adds coverage. The first
      # run after a long gap pays one replay of the backlog; later ones a
      # few thousand units.
      - name: Minimize the corpus before it is cached
        working-directory: ext/makiri/rust/fuzz
        run: |
          before=$(ls corpus/${{ matrix.target }} | wc -l)
          cargo fuzz cmin ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_len=4096 \
            -timeout=30
          after=$(ls corpus/${{ matrix.target }} | wc -l)
          echo "corpus/${{ matrix.target }}: $before -> $after files"

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-artifacts-${{ matrix.target }}
          path: ext/makiri/rust/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
