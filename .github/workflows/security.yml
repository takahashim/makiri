name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

jobs:
  # A "C safety lint" job stood here (`rake security:clint`, over
  # script/check_c_safety.rb). It enforced rules about C that no longer exists -
  # bounded reads through mkr_span, no raw cursor members, no unchecked size
  # arithmetic. The equivalents are now type-level rather than lint-level:
  # slices carry their length, and the allocation chokepoint is enforced by
  # `clippy.toml`'s disallowed-methods - run with `-D warnings` by ci.yml's
  # Clippy step (the crate) and libfuzzer.yml's (the fuzz crate, nightly).

  # A security-sanitize job stood here and ran `rake sanitize`. ci.yml's
  # `sanitize` job already does (Ruby 3.4 and 4.0) and adds the Ruby-free engine
  # tests under ASan, so this was a second copy of the same run.

  security-fuzz-short:
    name: Short sanitized fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run short fuzz under sanitizers
        run: bundle exec rake fuzz:sanitize FUZZ_ARGS="--time 30"

  # macOS-only malloc-leak gate: ASan everywhere runs with detect_leaks=0 (Ruby
  # and Lexbor are uninstrumented), so this is the ONLY automated leak check. It
  # flags per-call leak stacks through the extension, including on rescued
  # failure paths (see script/check_leaks.rb).
  security-leaks:
    name: Malloc-leak gate (macOS leaks)
    runs-on: macos-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the leak gate
        run: bundle exec rake leaks

  # OOM-injection sweep: rebuilds with MAKIRI_ALLOC_INJECT=1 and fails each core
  # C allocation site in turn, gating that every OOM branch fails closed - a
  # clean exception or a baseline-identical result, never truncated output
  # (see script/check_alloc_failures.rb).
  security-alloc-inject:
    name: OOM-injection sweep
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the OOM-injection sweep
        run: bundle exec rake oom

  # Nightly: fuzz EVERY target (the 30s PR fuzz covers only the default xpath
  # target; the CSS engine reuse and the XML parser/mutator are each their own
  # documented memory-safety risk, so each gets a full 300s run).
  security-fuzz-nightly:
    name: Nightly sanitized fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [xpath, css, xml, mutate, xmlcss]
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run nightly fuzz under sanitizers
        run: bundle exec rake fuzz:sanitize FUZZ_ARGS="--target ${{ matrix.target }} --time 300"

  # Nightly: the whole spec suite with Lexbor ITSELF built under ASan (mraw
  # poisoning on), catching intra-arena overflows that a plain ASan build cannot
  # see - the class the v3.0.0 :lexbor-contains overflow belonged to. Heavy
  # (full instrumented Lexbor rebuild), so nightly only.
  # The randomised property checks (spec/invariants/). Cheap enough to gate a PR
  # on, so they run on every push; the ASan pass is nightly because an
  # instrumented build is slow.
  invariants:
    name: Invariant checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the invariant checks
        run: bundle exec rake invariants

  invariants-sanitize:
    name: Nightly invariant checks under AddressSanitizer
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The text index hands out borrowed slices, so a stale one is a memory bug
      # as much as a wrong answer - this is the pass that would see it.
      - name: Run the invariant checks under sanitizers
        run: bundle exec rake "invariants:sanitize"

  security-sanitize-lexbor:
    name: Nightly instrumented-Lexbor ASan suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      # The extension is a Rust crate; cargo is part of the build now. stable is
      # the default because that is what ships - but nightly has to be PRESENT
      # too: -Zsanitizer is unstable, so extconf sets RUSTUP_TOOLCHAIN=nightly
      # for an ASan build (and aborts rather than quietly building it plain).
      # Installed uniformly across this file's jobs; the few that never sanitize
      # pay one toolchain download for one block instead of nine variants.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the nightly toolchain (for -Zsanitizer)
        run: rustup toolchain install nightly

      - name: Install libclang (bindgen, via rb-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build Lexbor under ASan and run the suite
        run: bundle exec rake "sanitize:lexbor"

