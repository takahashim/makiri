name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

jobs:
  security-lint:
    name: C safety lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run C safety lint
        run: bundle exec rake security:clint

  security-sanitize:
    name: ASan + UBSan security suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build + test under sanitizers
        run: bundle exec rake sanitize

  security-fuzz-short:
    name: Short sanitized fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run short fuzz under sanitizers
        run: bundle exec rake fuzz:sanitize FUZZ_ARGS="--time 30"

  # macOS-only malloc-leak gate: ASan everywhere runs with detect_leaks=0 (Ruby
  # and Lexbor are uninstrumented), so this is the ONLY automated leak check. It
  # flags per-call leak stacks through the extension, including on rescued
  # failure paths (see script/check_leaks.rb).
  security-leaks:
    name: Malloc-leak gate (macOS leaks)
    runs-on: macos-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the leak gate
        run: bundle exec rake leaks

  # OOM-injection sweep: rebuilds with MAKIRI_ALLOC_INJECT=1 and fails each core
  # C allocation site in turn, gating that every OOM branch fails closed - a
  # clean exception or a baseline-identical result, never truncated output
  # (see script/check_alloc_failures.rb).
  security-alloc-inject:
    name: OOM-injection sweep
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the OOM-injection sweep
        run: bundle exec rake oom

  # Nightly: fuzz EVERY target (the 30s PR fuzz covers only the default xpath
  # target; the CSS engine reuse and the XML parser/mutator are each their own
  # documented memory-safety risk, so each gets a full 300s run).
  security-fuzz-nightly:
    name: Nightly sanitized fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [xpath, css, xml, mutate, xmlcss]
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run nightly fuzz under sanitizers
        run: bundle exec rake fuzz:sanitize FUZZ_ARGS="--target ${{ matrix.target }} --time 300"

  # Nightly: the whole spec suite with Lexbor ITSELF built under ASan (mraw
  # poisoning on), catching intra-arena overflows that a plain ASan build cannot
  # see - the class the v3.0.0 :lexbor-contains overflow belonged to. Heavy
  # (full instrumented Lexbor rebuild), so nightly only.
  # The randomised property checks (spec/invariants/). Cheap enough to gate a PR
  # on, so they run on every push; the ASan pass is nightly because an
  # instrumented build is slow.
  invariants:
    name: Invariant checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the invariant checks
        run: bundle exec rake invariants

  invariants-sanitize:
    name: Nightly invariant checks under ASan + UBSan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The text index hands out borrowed slices, so a stale one is a memory bug
      # as much as a wrong answer - this is the pass that would see it.
      - name: Run the invariant checks under sanitizers
        run: bundle exec rake "invariants:sanitize"

  security-sanitize-lexbor:
    name: Nightly instrumented-Lexbor ASan suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build Lexbor under ASan and run the suite
        run: bundle exec rake "sanitize:lexbor"

  # The Rust port's memory-safety and fail-closed gates. The HTML instance is
  # the one every Node#xpath on an HTML document goes through, so it is the
  # configuration worth the nightly budget; the per-push matrix in ci.yml covers
  # the others with the spec suite.
  rust-fuzz:
    name: Rust port - fuzz + OOM (HTML instance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with vendored Lexbor submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure cmake is available
        uses: lukka/get-cmake@latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The xmlconf runner reads the W3C manifests with it, and it is in the
      # optional :bench group rather than the default bundle.
      - name: Install nokogiri (for the conformance manifests)
        run: gem install --no-document nokogiri

      # The XML parser's conformance, against the same corpus and the same
      # scoring the C build is held to.
      - name: XML conformance (W3C xmlts)
        env:
          MAKIRI_RUST_XML: "1"
          MAKIRI_RUST_XPATH_SHARED: "1"
          MAKIRI_RUST_XPATH_DRIVER: "1"
          MAKIRI_RUST_XPATH_HTML: "1"
          MAKIRI_RUST_XPATH_XML: "1"
        run: bundle exec rake conformance:xmlconf

      # Under ASan + UBSan: any heap error or UB in the Rust engine aborts the
      # run. The targets are the ones that drive it - xpath over HTML, css
      # (whose lowering builds the same AST), and xmlcss (the XML instance plus
      # the of-type hooks).
      - name: Fuzz under sanitizers
        env:
          MAKIRI_RUST_XPATH_SHARED: "1"
          MAKIRI_RUST_XPATH_DRIVER: "1"
          MAKIRI_RUST_XPATH_HTML: "1"
          MAKIRI_RUST_XPATH_XML: "1"
        run: |
          bundle exec rake "fuzz:sanitize" FUZZ_ARGS="--target xpath --time 300"
          bundle exec rake "fuzz:sanitize" FUZZ_ARGS="--target css --time 180"
          bundle exec rake "fuzz:sanitize" FUZZ_ARGS="--target xmlcss --time 180"

      # Every OOM branch must fail closed - a clean raise or a result identical
      # to the un-injected one, never a truncated answer.
      - name: OOM injection sweep
        env:
          MAKIRI_RUST_XPATH_SHARED: "1"
          MAKIRI_RUST_XPATH_DRIVER: "1"
          MAKIRI_RUST_XPATH_HTML: "1"
          MAKIRI_RUST_XPATH_XML: "1"
        run: bundle exec rake oom
