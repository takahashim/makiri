name: Release

# Build the source gem and precompiled ("fat") native gems for the major
# platforms, attach them to a GitHub Release, and (optionally, on manual
# dispatch) publish to RubyGems.
#
# Native gems are built on each target platform's own runner - NOT
# cross-compiled - because the extension is a Rust crate that rb-sys builds
# against the headers of the Ruby running extconf (see
# ext/makiri/rust/extconf.rb). Each runner compiles for every Ruby in
# RUBY_ABIS; script/build_native_gem.rb then assembles one gem per platform
# containing all of those ABIs (lib/makiri.rb selects the right one at require
# time). `gem install` of a native gem does not recompile or need a Rust
# toolchain. The source gem does: `source-gem-install` installs it the way a
# user without a native gem would, and nothing is released or published
# unless that works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_rubygems:
        description: "Push the built gems to RubyGems (via Trusted Publishing / OIDC)"
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub Release and upload assets

env:
  RUBY_ABIS: "3.3 3.4 4.0"   # Ruby minor versions a native gem serves

jobs:
  # --- source gem (always builds; compiles from source at install time) -------
  source-gem:
    name: Source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Lexbor's LICENSE and NOTICE are in the gem's file list, and
          # `git ls-files --recurse-submodules` lists them only from a
          # checked-out submodule. Nothing else of Lexbor is in the gem.
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build source gem
        run: |
          mkdir -p pkg
          gem build makiri.gemspec -o pkg/makiri-source.gem
      - uses: actions/upload-artifact@v7
        with:
          name: gem-source
          path: pkg/*.gem
          if-no-files-found: error

  # --- install the source gem as a user would, and use it ----------------------
  # What `gem install makiri` does on a platform with no native gem: extconf
  # runs cargo through rb-sys at install time. Once with the oldest Rust the
  # crate declares (Cargo.toml's rust-version) and the oldest Ruby, once with
  # the current ones; the require and the queries run outside the checkout, so
  # they load the installed gem and nothing else.
  source-gem-install:
    name: Install source gem (${{ matrix.os }}, Ruby ${{ matrix.ruby }}, Rust ${{ matrix.rust }})
    needs: source-gem
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ruby: "3.3", rust: msrv }
          - { os: ubuntu-latest, ruby: "4.0", rust: stable }
          - { os: macos-14,      ruby: "3.4", rust: stable }
    steps:
      - uses: actions/checkout@v6   # for Cargo.toml's rust-version only
      - name: Read the Rust version to install
        id: rust
        shell: bash
        run: |
          if [ "${{ matrix.rust }}" = msrv ]; then
            v="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' ext/makiri/rust/Cargo.toml)"
            [ -n "$v" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          else
            v=stable
          fi
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Install libclang (rb-sys generates Ruby's bindings with it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v8
        with:
          name: gem-source
          path: pkg
      - name: The gem carries nothing for development
        shell: bash
        run: |
          gem spec pkg/makiri-source.gem files | tee files.txt
          if grep -E '^- (\.github/|ext/makiri/rust/fuzz/|ext/makiri/rust/tests/|script/|tools/|spec/|bench/|docs/|vendor/lexbor/(source|test|build))' files.txt; then
            echo "::error::the source gem carries development files"; exit 1
          fi
          grep -q '^- vendor/lexbor/LICENSE$' files.txt && grep -q '^- vendor/lexbor/NOTICE$' files.txt \
            || { echo "::error::the source gem lacks Lexbor's LICENSE or NOTICE"; exit 1; }
          grep -q '^- ext/makiri/rust/Cargo.lock$' files.txt \
            || { echo "::error::the source gem lacks Cargo.lock"; exit 1; }
      - name: gem install (compiles the crate)
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
        run: |
          rustc --version
          gem install pkg/makiri-source.gem --verbose
      - name: Use the installed gem
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          ruby -e '
            require "makiri"
            puts Makiri::VERSION
            html = Makiri::HTML("<ul><li class=a>1</li><li>2</li></ul><svg><a href=x/></svg>")
            raise "css" unless html.css("li.a").map(&:text) == ["1"]
            raise "xpath" unless html.xpath("count(//li)") == 2.0
            raise "link" unless html.css(":link").size == 1
            raise "serialize" unless html.at_css("ul").to_html.start_with?("<ul>")
            xml = Makiri::XML(%(<feed xmlns="urn:a"><entry id="e"/></feed>))
            raise "xml css" unless xml.css("entry").map { |e| e["id"] } == ["e"]
            raise "xml xpath" unless xml.at_xpath("//a:entry", "a" => "urn:a")
            puts "ok"
          '

  # --- compile the extension natively, per platform x Ruby --------------------
  compile:
    name: Compile ${{ matrix.platform }} (Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        platform:
        - x86_64-linux
        - aarch64-linux
        - arm64-darwin
        - x64-mingw-ucrt
        include:
          - { platform: x86_64-linux,   os: ubuntu-latest }
          - { platform: aarch64-linux,  os: ubuntu-24.04-arm }
          - { platform: arm64-darwin,   os: macos-14 }
          - { platform: x64-mingw-ucrt, os: windows-latest }
    steps:
      - uses: actions/checkout@v6   # the crate alone: no submodule
      # The extension is a Rust crate, so every release runner needs cargo. This
      # is the job that produces the precompiled gems, which is what most users
      # install - if it cannot build, the gem falls back to a source install and
      # every one of those users needs a toolchain of their own.
      - uses: dtolnay/rust-toolchain@stable
        with:
          # RubyInstaller's Ruby is a MinGW build, but a default rustup on
          # Windows installs the MSVC host - and rb-sys will not generate
          # bindings from Ruby's headers across that ABI boundary. extconf.rb
          # names the GNU triple; this installs the std that goes with it.
          # Empty elsewhere, so the other runners are unaffected.
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Install libclang (rb-sys generates Ruby's bindings with it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Compile the extension
        run: bundle exec rake compile
      - name: Smoke-load
        shell: bash
        run: bundle exec ruby -Ilib -r makiri -e 'p Makiri::VERSION'
      - name: Stage the compiled binary under its ABI subdir
        shell: bash
        run: |
          minor="$(ruby -e 'print RUBY_VERSION[/\d+\.\d+/]')"
          dlext="$(ruby -e 'print RbConfig::CONFIG["DLEXT"]')"   # so | bundle
          mkdir -p "artifact/${minor}"
          cp "lib/makiri/makiri.${dlext}" "artifact/${minor}/makiri.${dlext}"
          ls -l "artifact/${minor}"
      - name: Assert the binary is Ruby-portable (no libruby hard-link)
        shell: bash
        # extconf.rb builds the extension with dynamic_lookup / no libruby link so
        # one precompiled binary loads on any compatible Ruby of that ABI. If a
        # change reintroduces a libruby dependency, the gem would only load on the
        # exact build Ruby — fail loudly here instead of shipping a broken gem.
        run: |
          dlext="$(ruby -e 'print RbConfig::CONFIG["DLEXT"]')"
          bin="lib/makiri/makiri.${dlext}"
          case "$(uname -s)" in
            Darwin)
              if otool -L "$bin" | grep -i 'libruby'; then
                echo "::error::$bin hard-links libruby; precompiled gem would not load on other Ruby installs"; exit 1
              fi
              ;;
            MINGW*|MSYS*|CYGWIN*)
              # Windows PE DLLs MUST import the Ruby DLL via the import library
              # (no dynamic_lookup on PE/COFF). A libruby import here is by design,
              # not a portability bug, so this assertion does not apply.
              echo "Windows (x64-mingw-ucrt): Ruby import-library link is by design; skipping libruby assertion"
              ;;
            *)
              if readelf -d "$bin" 2>/dev/null | grep -iE 'NEEDED.*libruby'; then
                echo "::error::$bin has a libruby NEEDED entry; precompiled gem may not load on a static Ruby"; exit 1
              fi
              ;;
          esac
          echo "OK: portability check complete for $bin"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.ruby }}
          path: artifact/
          if-no-files-found: error

  # --- assemble one fat gem per platform from its per-ABI binaries ------------
  native-gem:
    name: Native gem ${{ matrix.platform }}
    needs: compile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: x86_64-linux
          os: ubuntu-latest
        - platform: aarch64-linux
          os: ubuntu-24.04-arm
        - platform: arm64-darwin
          os: macos-14
        - platform: x64-mingw-ucrt
          os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # For the gemspec's file scan: Lexbor's LICENSE and NOTICE, which the
          # native gem carries too (ext/ is dropped).
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Download this platform's per-ABI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-${{ matrix.platform }}-*
          merge-multiple: true
          path: staged
      - name: Place binaries under lib/makiri/<abi>/
        shell: bash
        run: |
          mkdir -p lib/makiri
          echo "Downloaded artifacts:"
          find staged -maxdepth 3 -type f -print || true
          if ! find staged -mindepth 2 -maxdepth 2 -name 'makiri.*' | grep -q .; then
            echo "::error::No makiri binaries were downloaded for ${{ matrix.platform }}"
            exit 1
          fi
          cp -r staged/* lib/makiri/
          echo "Staged binaries:"
          find lib/makiri -maxdepth 2 -name 'makiri.*' -print
      - name: Build the native gem
        run: ruby script/build_native_gem.rb "${{ matrix.platform }}"
      - name: Verify it installs without recompiling
        shell: bash
        run: |
          gem spec "makiri-"*"-${{ matrix.platform }}.gem" files | grep -q '^- vendor/lexbor/NOTICE$' \
            || { echo "::error::the native gem lacks Lexbor's NOTICE"; exit 1; }
          gem install "makiri-"*"-${{ matrix.platform }}.gem" --local
          ruby -e 'require "makiri"; puts Makiri::VERSION'
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: "*.gem"
          if-no-files-found: error

  # --- attach every gem to a GitHub Release (on a version tag) ----------------
  release:
    name: GitHub Release
    needs: [source-gem, source-gem-install, native-gem]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          merge-multiple: true
          path: dist
      - name: List assets
        run: ls -l dist
      - name: Create / update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark pre-release tags (v1.2.3.rc1 / -beta / -alpha / -pre) as such.
          pre=""
          case "$GITHUB_REF_NAME" in
            *rc*|*beta*|*alpha*|*pre*) pre="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/*.gem \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release for ${GITHUB_REF_NAME}. See CHANGELOG.md." \
            $pre --verify-tag || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.gem --repo "${GITHUB_REPOSITORY}" --clobber

  # --- publish to RubyGems, behind the `rubygems` environment approval gate ---
  # Held until the `rubygems` environment's Required-reviewers rule is approved,
  # so a tag push releases on GitHub immediately but the RubyGems push waits.
  #
  # Auth is RubyGems Trusted Publishing (OIDC): no stored API key. Configure a
  # matching Trusted Publisher on RubyGems.org (owner=takahashim, repo=makiri,
  # workflow=release.yml, Environment=rubygems) so the token is only accepted
  # through this gated environment.
  publish:
    name: Publish to RubyGems
    needs: [source-gem, source-gem-install, native-gem]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_rubygems)
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write       # OIDC identity token for Trusted Publishing
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          merge-multiple: true
          path: dist
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@762a4b77c3300434bb57c7ce80b20e36231927aa # v2.0.0
      - name: gem push
        run: |
          for g in dist/*.gem; do
            echo "Pushing $g"
            gem push "$g"
          done
